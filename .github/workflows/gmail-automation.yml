name: Gmail Automation

on:
  workflow_dispatch:
    inputs:
      job_id:
        description: "Firestore job ID to process"
        required: true
        type: string

jobs:
  automate:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: pip install Appium-Python-Client==3.1.1 selenium google-cloud-firestore google-auth cryptography pyotp requests

      - name: Set up JDK (required by Appium)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install Appium and UIAutomator2 driver
        run: |
          npm install -g appium@3
          appium driver install uiautomator2
          appium --version

      - name: Download ChromeDriver 113 (matches Chrome on google_apis Android 34 emulator)
        run: |
          cd /tmp
          wget -q "https://chromedriver.storage.googleapis.com/113.0.5672.63/chromedriver_linux64.zip"
          unzip -o chromedriver_linux64.zip
          chmod +x chromedriver
          echo "CHROMEDRIVER_PATH=/tmp/chromedriver" >> $GITHUB_ENV
          /tmp/chromedriver --version

      - name: Enable KVM for hardware acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Start Appium server
        run: |
          appium --address 127.0.0.1 --port 4723 --log /tmp/appium.log &
          echo "Appium PID=$!" >> $GITHUB_ENV
          sleep 4
          curl -s http://127.0.0.1:4723/status | python3 -c "import sys,json; d=json.load(sys.stdin); print('Appium ready:', d.get('value',{}).get('ready',False))"

      - name: Run automation with Android emulator
        uses: reactivecircus/android-emulator-runner@v2
        env:
          JOB_ID: ${{ github.event.inputs.job_id }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          FIREBASE_CREDENTIALS_JSON: ${{ secrets.FIREBASE_CREDENTIALS_JSON }}
          ENCRYPTION_KEY: ${{ secrets.ENCRYPTION_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          FIRESTORE_DATABASE: ${{ secrets.FIRESTORE_DATABASE }}
          CHROMEDRIVER_PATH: ${{ env.CHROMEDRIVER_PATH }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          # pixel_6_pro is the closest available profile — we spoof model via ADB in the script
          profile: pixel_6_pro
          avd-name: Pixel10
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: python3 services/device_automation/run_automation.py --job-id "$JOB_ID"

      - name: Upload Appium logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: appium-logs
          path: /tmp/appium.log
          retention-days: 3
